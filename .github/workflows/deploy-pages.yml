name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare static site
        run: |
          mkdir site
          unzip -q rattenreich-pages.zip -d site
          python - <<'PY'
          from pathlib import Path

          replacements = (
              ('/Ratten-Reich', '/RattenReich'),
              ('/RattenReich/_next', '__RR_NEXT__'),
              ('/RattenReich/images/', '__RR_IMAGES__'),
              ('/RattenReich/favicon.svg', '__RR_FAVICON__'),
              ('/_next', '/RattenReich/_next'),
              ('/images/', '/RattenReich/images/'),
              ('/favicon.svg', '/RattenReich/favicon.svg'),
              ('__RR_NEXT__', '/RattenReich/_next'),
              ('__RR_IMAGES__', '/RattenReich/images/'),
              ('__RR_FAVICON__', '/RattenReich/favicon.svg'),
              ('от −5 до +5', 'от −3 до +5'),
          )
          guard = """<script id="rr-skill-min-guard">(()=>{const sync=()=>document.querySelectorAll('.rows.skills .stat-row').forEach(r=>{const s=r.querySelector('output'),b=r.querySelector('button[aria-label="Уменьшить"]');if(s&&b)b.disabled=Number(s.textContent)<=-3});document.addEventListener('click',e=>{const b=e.target.closest?.('button[aria-label="Уменьшить"]');if(b&&b.closest('.rows.skills')&&Number(b.closest('.stat-row')?.querySelector('output')?.textContent)<=-3){e.preventDefault();e.stopImmediatePropagation()}},true);new MutationObserver(sync).observe(document.body,{subtree:true,childList:true,characterData:true});sync()})();</script>"""
          for path in Path('site').rglob('*'):
              if not path.is_file() or path.suffix.lower() not in {'.html', '.js', '.css', '.json', '.txt', '.svg'}:
                  continue
              text = path.read_text(encoding='utf-8')
              fixed = text
              for old, new in replacements:
                  fixed = fixed.replace(old, new)
              if path.suffix.lower() == '.html' and 'rr-skill-min-guard' not in fixed:
                  fixed = fixed.replace('</body>', guard + '</body>')
              if fixed != text:
                  path.write_text(fixed, encoding='utf-8')
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
